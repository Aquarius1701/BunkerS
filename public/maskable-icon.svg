<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2547"/>
      <stop offset="100%" stop-color="#071326"/>
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD043"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="shieldGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3E7B"/>
      <stop offset="100%" stop-color="#0F2547"/>
    </linearGradient>
    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FFB800" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full bleed background for maskable purpose -->
  <rect width="512" height="512" fill="url(#maskBg)"/>

  <!-- Centered emblem scaled to safe-area (within central 80% circle, r=204) -->
  <g transform="translate(64, 52) scale(0.75)">
    <!-- Inner shield plate -->
    <path d="M256 64 L416 120 V256 C416 352 256 432 256 432 C256 432 96 352 96 256 V120 Z" fill="url(#shieldGradM)" stroke="#2D5A9E" stroke-width="4"/>

    <!-- Construction HardHat Emblem inside Shield -->
    <g transform="translate(136, 140) scale(10)" filter="url(#glowM)">
      <path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5" fill="none" stroke="url(#goldGradM)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 6a6 6 0 0 1 6 6v3" fill="none" stroke="url(#goldGradM)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 15v-3a6 6 0 0 1 6-6" fill="none" stroke="url(#goldGradM)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="2" y="15" width="20" height="4" rx="1" fill="#FFB800" stroke="#FFE082" stroke-width="1.2"/>
    </g>

    <!-- Stylized text -->
    <text x="256" y="388" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" text-anchor="middle" fill="#FFFFFF">
      BUNKER<tspan fill="#FFB800">STROY</tspan>
    </text>
  </g>
</svg>