<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BunkerStroy - Oflayn Rejim</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #0F2547 0%, #071326 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 37, 71, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #254B85;
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .icon-box {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #0F2547;
      border: 2px solid #FFB800;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(255, 184, 0, 0.3);
    }
    .icon-box svg {
      width: 44px;
      height: 44px;
      stroke: #FFB800;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    h1 span {
      color: #FFB800;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #FFB800;
      color: #071326;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #FFD043;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(255, 184, 0, 0.35);
    }
    .btn:active {
      transform: translateY(0);
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 6px 14px;
      background: rgba(37, 75, 133, 0.4);
      border: 1px solid #254B85;
      border-radius: 999px;
      font-size: 12px;
      color: #CBD5E1;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <!-- Construction / Signal Offline Icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/>
        <path d="M14 6a6 6 0 0 1 6 6v3"/>
        <path d="M4 15v-3a6 6 0 0 1 6-6"/>
        <rect x="2" y="15" width="20" height="4" rx="1"/>
      </svg>
    </div>
    <h1>BUNKER<span>STROY</span> Oflayn</h1>
    <p>
      Hozirda internet aloqasi mavjud emas. Avval ko‘rilgan tovarlar va buyurtmalar kesh xotirasida saqlangan. Aloqa tiklanganda avtomatik yangilanadi.
    </p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
      Qayta Yuklash / Обновить
    </button>
    <div class="badge">
      ⚡ Offline Service Worker Active
    </div>
  </div>
</body>
</html>
